<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hub da Diarista</title>
    <link rel="stylesheet" href="hubdadiarista.css" />
</head>

<body>
    <header>
        <h1>Hub da Diarista</h1>
        <p>Preencha os dados abaixo para solicitar seu horário.</p>

        <nav>
            <a href="index.html">Agendamento</a>
            <a href="regulamentos.html">Regulamentos</a>
        </nav>
    </header>

    <main>
        <section>
            <h2>Calendário de agendamentos</h2>
            <div id="calendar" class="calendar"></div>
        </section>

        <section>
            <h2>Solicitar agendamento</h2>

            <form id="appointmentForm">
                <label>
                    Nome da cliente
                    <input id="client" type="text" placeholder="Digite seu nome" required />
                </label>

                <label>
                    Tipo de limpeza
                    <select id="service" required>
                        <option value="">Selecione</option>
                        <option>Limpeza geral</option>
                        <option>Pós-obra</option>
                    </select>
                </label>

                <label>
                    Dia desejado
                    <input id="date" type="date" required />
                </label>

                <label>
                    Horário de início
                    <select id="time" required>
                        <option value="">Selecione</option>
                        <option value="06:00">06:00</option>
                        <option value="07:00">07:00</option>
                        <option value="08:00">08:00</option>
                    </select>
                </label>

                <label>
                    Endereço
                    <input id="address" type="text" placeholder="Rua, número e bairro" required />
                </label>

                <label>
                    Frequência do atendimento
                    <select id="contractType" required>
                        <option value="">Selecione</option>
                        <option>Atendimento avulso</option>
                        <option>Semanal</option>
                        <option>Quinzenal</option>
                        <option>Mensal</option>
                    </select>
                </label>

                <label>
                    Repetir por
                    <select id="repeatUntil" required>
                        <option value="single">Somente este agendamento</option>
                        <option value="month">Durante este mês</option>
                        <option value="2">Por 2 meses</option>
                        <option value="3">Por 3 meses</option>
                    </select>
                </label>

                <label>
                    Observações
                    <textarea id="notes"
                        placeholder="Ex: tenho pets, preciso de limpeza na cozinha, preferência de acesso..."></textarea>
                </label>

                <button type="submit">Enviar solicitação de agendamento</button>
            </form>
        </section>

        <section>
            <h2>Status dos agendamentos</h2>

            <table>
                <thead>
                    <tr>
                        <th>Cliente</th>
                        <th>Data</th>
                        <th>Tipo</th>
                        <th>Status</th>
                    </tr>
                </thead>

                <tbody id="appointmentsTable"></tbody>
            </table>
        </section>
    </main>

    <script>
        const apiUrl = "SUA_URL_DO_APPS_SCRIPT_AQUI";
        const whatsappNumber = "5511932118634";

        const appointments = [];

        const statusOptions = [
            "Aguardando confirmação",
            "Serviço agendado",
            "Serviço em andamento",
            "Serviço concluído",
            "Pago",
            "Não concluído"
        ];

        const form = document.getElementById("appointmentForm");
        const calendar = document.getElementById("calendar");
        const appointmentsTable = document.getElementById("appointmentsTable");

        form.addEventListener("submit", function (event) {
            event.preventDefault();

            const baseAppointment = {
                client: document.getElementById("client").value,
                service: document.getElementById("service").value,
                date: document.getElementById("date").value,
                time: document.getElementById("time").value,
                address: document.getElementById("address").value,
                contractType: document.getElementById("contractType").value,
                repeatUntil: document.getElementById("repeatUntil").value,
                notes: document.getElementById("notes").value,
                status: "Aguardando confirmação"
            };

            const dates = generateAppointmentDates(
                baseAppointment.date,
                baseAppointment.contractType,
                baseAppointment.repeatUntil
            );

            const generatedAppointments = dates.map(function (date, index) {
                return {
                    ...baseAppointment,
                    id: Date.now() + index,
                    date: date
                };
            });

            saveAppointments(generatedAppointments);
        });

        function saveAppointments(generatedAppointments) {
            generatedAppointments.forEach(function (appointment) {
                fetch(apiUrl, {
                    method: "POST",
                    mode: "no-cors",
                    body: JSON.stringify({
                        id: appointment.id,
                        dataEnvio: new Date().toLocaleString("pt-BR"),
                        cliente: appointment.client,
                        servico: appointment.service,
                        dataAgendamento: appointment.date,
                        horario: appointment.time,
                        endereco: appointment.address,
                        frequencia: appointment.contractType,
                        observacoes: appointment.notes,
                        status: appointment.status
                    })
                });
            });

            appointments.push(...generatedAppointments);
            render();
            sendToWhatsApp(generatedAppointments);
            form.reset();
        }

        function loadAppointments() {
            fetch(apiUrl)
                .then(function (response) {
                    return response.json();
                })
                .then(function (data) {
                    appointments.length = 0;

                    data.forEach(function (item) {
                        appointments.push({
                            id: item.id,
                            client: item.cliente,
                            service: item.servico,
                            date: item.dataAgendamento,
                            time: item.horario,
                            address: item.endereco,
                            contractType: item.frequencia,
                            notes: item.observacoes,
                            status: item.status || "Aguardando confirmação"
                        });
                    });

                    render();
                })
                .catch(function () {
                    render();
                });
        }

        function render() {
            calendar.innerHTML = "";
            appointmentsTable.innerHTML = "";

            appointments
                .slice()
                .sort(function (a, b) {
                    return String(a.date).localeCompare(String(b.date));
                })
                .forEach(function (item, index) {
                    calendar.innerHTML += `
                        <div class="day">
                            <strong>${formatDate(item.date)}</strong>

                            <div class="event">
                                ${formatTime(item.time)}<br>
                                ${item.service}<br>
                                ${item.status}
                            </div>
                        </div>
                    `;

                    appointmentsTable.innerHTML += `
                        <tr>
                            <td data-label="Cliente">${item.client}</td>
                            <td data-label="Data">${formatDate(item.date)}</td>
                            <td data-label="Tipo">${item.contractType}</td>
                            <td data-label="Status">
                                <select class="status-select" onchange="changeStatus(${index}, this.value)">
                                    ${statusOptions.map(function (status) {
                        return `
                                            <option value="${status}" ${item.status === status ? "selected" : ""}>
                                                ${status}
                                            </option>
                                        `;
                    }).join("")}
                                </select>
                            </td>
                        </tr>
                    `;
                });
        }

        function changeStatus(index, newStatus) {
            appointments[index].status = newStatus;
            render();

            fetch(apiUrl, {
                method: "POST",
                mode: "no-cors",
                body: JSON.stringify({
                    action: "updateStatus",
                    id: appointments[index].id,
                    status: newStatus
                })
            });
        }

        function generateAppointmentDates(startDate, frequency, repeatUntil) {
            const dates = [];
            const start = parseLocalDate(startDate);

            if (repeatUntil === "single" || frequency === "Atendimento avulso") {
                return [formatDateKey(start)];
            }

            let endDate;

            if (repeatUntil === "month") {
                endDate = new Date(start.getFullYear(), start.getMonth() + 1, 0);
            } else {
                endDate = addMonths(start, Number(repeatUntil));
            }

            if (frequency === "Semanal") {
                addRepeatedDates(dates, start, endDate, 7);
            }

            if (frequency === "Quinzenal") {
                addRepeatedDates(dates, start, endDate, 14);
            }

            if (frequency === "Mensal") {
                let current = new Date(start);

                while (current <= endDate) {
                    dates.push(formatDateKey(current));
                    current = addMonths(current, 1);
                }
            }

            return dates.length ? dates : [formatDateKey(start)];
        }

        function addRepeatedDates(dates, start, endDate, intervalDays) {
            let current = new Date(start);

            while (current <= endDate) {
                dates.push(formatDateKey(current));
                current.setDate(current.getDate() + intervalDays);
            }
        }

        function parseLocalDate(value) {
            return new Date(value + "T00:00:00");
        }

        function formatDateKey(date) {
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, "0");
            const day = String(date.getDate()).padStart(2, "0");

            return `${year}-${month}-${day}`;
        }

        function addMonths(date, months) {
            const result = new Date(date);
            result.setMonth(result.getMonth() + months);
            return result;
        }

        function sendToWhatsApp(generatedAppointments) {
            const firstAppointment = generatedAppointments[0];

            const datesText = generatedAppointments
                .map(function (appointment) {
                    return `- ${formatDate(appointment.date)} às ${formatTime(appointment.time)}`;
                })
                .join("\n");

            const message = `
Olá! Nova solicitação de agendamento:

Cliente: ${firstAppointment.client}
Serviço: ${firstAppointment.service}
Frequência: ${firstAppointment.contractType}

Datas solicitadas:
${datesText}

Endereço: ${firstAppointment.address}
Observações: ${firstAppointment.notes || "Nenhuma"}

Status: aguardando confirmação.
            `;

            const url = `https://wa.me/${whatsappNumber}?text=${encodeURIComponent(message)}`;
            window.open(url, "_blank");
        }

        function formatDate(date) {
            if (!date) {
                return "";
            }

            const textDate = String(date);

            if (textDate.includes("T")) {
                const onlyDate = textDate.split("T")[0];
                return new Date(onlyDate + "T00:00:00").toLocaleDateString("pt-BR");
            }

            const parsedDate = new Date(textDate + "T00:00:00");

            if (isNaN(parsedDate.getTime())) {
                return textDate;
            }

            return parsedDate.toLocaleDateString("pt-BR");
        }

        function formatTime(time) {
            if (!time) {
                return "";
            }

            const textTime = String(time);

            if (textTime.includes("T")) {
                return new Date(textTime).toLocaleTimeString("pt-BR", {
                    hour: "2-digit",
                    minute: "2-digit"
                });
            }

            return textTime;
        }

        loadAppointments();
    </script>
    
</body>

</html>
