<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hub da Diarista</title>
    <link rel="stylesheet" href="hubdadiarista.css" />
</head>

<body>
    <header>
        <h1>Hub da Diarista</h1>
        <p>Preencha os dados abaixo para solicitar seu horário.</p>

        <nav>
            <a href="index.html">Agendamento</a>
            <a href="regulamentos.html">Regulamentos</a>
        </nav>
    </header>

    <main>
        <section>
            <h2>Calendário de agendamentos</h2>
            <p class="section-note">Horários já preenchidos aparecem como indisponíveis.</p>
            <div id="calendar" class="calendar"></div>
        </section>

        <section>
            <h2>Solicitar agendamento</h2>

            <form id="appointmentForm">
                <label>
                    Nome da cliente
                    <input id="client" type="text" placeholder="Digite seu nome" required />
                </label>

                <label>
                    Tipo de limpeza
                    <select id="service" required>
                        <option value="">Selecione</option>
                        <option>Limpeza geral</option>
                        <option>Pós-obra</option>
                    </select>
                </label>

                <label>
                    Dia desejado
                    <input id="date" type="date" required />
                </label>

                <label>
                    Horário de início
                    <select id="time" required>
                        <option value="">Selecione</option>
                        <option value="06:00">06:00</option>
                        <option value="07:00">07:00</option>
                        <option value="08:00">08:00</option>
                    </select>
                </label>

                <p id="availabilityMessage" class="availability-message"></p>

                <label>
                    Endereço
                    <input id="address" type="text" placeholder="Rua, número e bairro" required />
                </label>

                <label>
                    Frequência do atendimento
                    <select id="contractType" required>
                        <option value="">Selecione</option>
                        <option>Atendimento avulso</option>
                        <option>Semanal</option>
                        <option>Quinzenal</option>
                        <option>Mensal</option>
                    </select>
                </label>

                <label>
                    Repetir por
                    <select id="repeatUntil" required>
                        <option value="single">Somente este agendamento</option>
                        <option value="month">Durante este mês</option>
                        <option value="2">Por 2 meses</option>
                        <option value="3">Por 3 meses</option>
                    </select>
                </label>

                <label>
                    Observações
                    <textarea id="notes"
                        placeholder="Ex: tenho pets, preciso de limpeza na cozinha, preferência de acesso..."></textarea>
                </label>

                <button type="submit">Enviar solicitação de agendamento</button>
            </form>
        </section>

        <section>
            <h2>Status dos agendamentos</h2>

            <table>
                <thead>
                    <tr>
                        <th>Cliente</th>
                        <th>Data</th>
                        <th>Horário</th>
                        <th>Serviço</th>
                        <th>Tipo</th>
                        <th>Status</th>
                    </tr>
                </thead>

                <tbody id="appointmentsTable"></tbody>
            </table>
        </section>
    </main>

    <script>
        const apiUrl = "https://script.google.com/macros/s/AKfycbxW0C3mi8mSG4xrjoE9ZRXjpPhV9mIuwe4xqigztj17E72jXyzA6kYYmO2TXKfk3noQ/exec";
        const whatsappNumber = "5511932118634";

        const appointments = [];

        const manualBlockedSlots = [
            // Use assim quando quiser bloquear manualmente:
            // { date: "2026-05-25", time: "06:00" },
            // { date: "2026-05-26", time: "dia-inteiro" }
        ];

        const statusOptions = [
            "Aguardando confirmação",
            "Serviço agendado",
            "Serviço em andamento",
            "Serviço concluído",
            "Pago",
            "Não concluído"
        ];

        const form = document.getElementById("appointmentForm");
        const calendar = document.getElementById("calendar");
        const appointmentsTable = document.getElementById("appointmentsTable");
        const dateInput = document.getElementById("date");
        const timeInput = document.getElementById("time");
        const availabilityMessage = document.getElementById("availabilityMessage");

        dateInput.addEventListener("change", updateAvailableTimes);
        timeInput.addEventListener("change", updateAvailabilityMessage);

        form.addEventListener("submit", function (event) {
            event.preventDefault();

            const baseAppointment = {
                client: document.getElementById("client").value.trim(),
                service: document.getElementById("service").value,
                date: document.getElementById("date").value,
                time: document.getElementById("time").value,
                address: document.getElementById("address").value.trim(),
                contractType: document.getElementById("contractType").value,
                repeatUntil: document.getElementById("repeatUntil").value,
                notes: document.getElementById("notes").value.trim(),
                status: "Aguardando confirmação"
            };

            const dates = generateAppointmentDates(
                baseAppointment.date,
                baseAppointment.contractType,
                baseAppointment.repeatUntil
            );

            const generatedAppointments = dates.map(function (date, index) {
                return {
                    ...baseAppointment,
                    id: Date.now() + index,
                    date: date
                };
            });

            const unavailableAppointments = generatedAppointments.filter(function (appointment) {
                return isSlotUnavailable(appointment.date, appointment.time);
            });

            if (unavailableAppointments.length > 0) {
                const unavailableText = unavailableAppointments
                    .map(function (appointment) {
                        return `${formatDate(appointment.date)} às ${formatTime(appointment.time)}`;
                    })
                    .join("\n");

                alert(`Esse horário já está indisponível:\n\n${unavailableText}\n\nEscolha outro dia ou horário.`);
                return;
            }

            saveAppointments(generatedAppointments);
        });

        async function saveAppointments(generatedAppointments) {
            try {
                for (const appointment of generatedAppointments) {
                    await fetch(apiUrl, {
                        method: "POST",
                        mode: "no-cors",
                        body: JSON.stringify({
                            id: appointment.id,
                            dataEnvio: new Date().toLocaleString("pt-BR"),
                            cliente: appointment.client,
                            servico: appointment.service,
                            dataAgendamento: appointment.date,
                            horario: appointment.time,
                            endereco: appointment.address,
                            frequencia: appointment.contractType,
                            observacoes: appointment.notes,
                            status: appointment.status
                        })
                    });
                }

                appointments.push(...generatedAppointments);
                render();
                sendToWhatsApp(generatedAppointments);
                form.reset();
                updateAvailableTimes();

                alert("Agendamento enviado com sucesso!");
            } catch (error) {
                alert("Não foi possível salvar o agendamento. Tente novamente.");
            }
        }

        function loadAppointments() {
            fetch(apiUrl)
                .then(function (response) {
                    return response.json();
                })
                .then(function (data) {
                    appointments.length = 0;

                    data.forEach(function (item) {
                        appointments.push({
                            id: item.id,
                            client: item.cliente,
                            service: item.servico,
                            date: normalizeDate(item.dataAgendamento),
                            time: normalizeTime(item.horario),
                            address: item.endereco,
                            contractType: item.frequencia,
                            notes: item.observacoes,
                            status: item.status || "Aguardando confirmação"
                        });
                    });

                    render();
                    updateAvailableTimes();
                })
                .catch(function () {
                    render();
                });
        }

        function render() {
            calendar.innerHTML = "";
            appointmentsTable.innerHTML = "";

            if (appointments.length === 0 && manualBlockedSlots.length === 0) {
                calendar.innerHTML = `
                    <div class="day">
                        <strong>Nenhum agendamento</strong>
                        <div class="event">Ainda não há agendamentos cadastrados.</div>
                    </div>
                `;

                appointmentsTable.innerHTML = `
                    <tr>
                        <td data-label="Cliente">Nenhum agendamento cadastrado</td>
                        <td data-label="Data">-</td>
                        <td data-label="Horário">-</td>
                        <td data-label="Serviço">-</td>
                        <td data-label="Tipo">-</td>
                        <td data-label="Status">-</td>
                    </tr>
                `;

                return;
            }

            appointments
                .slice()
                .sort(function (a, b) {
                    return `${a.date}${a.time}`.localeCompare(`${b.date}${b.time}`);
                })
                .forEach(function (item) {
                    calendar.innerHTML += `
                        <div class="day occupied">
                            <strong>${formatDate(item.date)}</strong>
                            <div class="event">
                                ${formatTime(item.time)}<br>
                                Indisponível
                            </div>
                        </div>
                    `;

                    appointmentsTable.innerHTML += `
                        <tr>
                            <td data-label="Cliente">
                                <span class="client-badge">${item.client || "Cliente"}</span>
                            </td>
                            <td data-label="Data">${formatDate(item.date)}</td>
                            <td data-label="Horário">${formatTime(item.time)}</td>
                            <td data-label="Serviço">${item.service || "-"}</td>
                            <td data-label="Tipo">${item.contractType || "-"}</td>
                            <td data-label="Status">
                                <select class="status-select" onchange="changeStatus('${item.id}', this.value)">
                                    ${statusOptions.map(function (status) {
                                        return `
                                            <option value="${status}" ${item.status === status ? "selected" : ""}>
                                                ${status}
                                            </option>
                                        `;
                                    }).join("")}
                                </select>
                            </td>
                        </tr>
                    `;
                });

            manualBlockedSlots.forEach(function (slot) {
                calendar.innerHTML += `
                    <div class="day occupied manual-block">
                        <strong>${formatDate(slot.date)}</strong>
                        <div class="event">
                            ${slot.time === "dia-inteiro" ? "Dia indisponível" : formatTime(slot.time)}<br>
                            Indisponível
                        </div>
                    </div>
                `;
            });
        }

        function changeStatus(id, newStatus) {
            const appointment = appointments.find(function (item) {
                return String(item.id) === String(id);
            });

            if (!appointment) {
                return;
            }

            appointment.status = newStatus;
            render();

            fetch(apiUrl, {
                method: "POST",
                mode: "no-cors",
                body: JSON.stringify({
                    action: "updateStatus",
                    id: appointment.id,
                    status: newStatus
                })
            });
        }

        function isSlotUnavailable(date, time) {
            const normalizedDate = normalizeDate(date);
            const normalizedTime = normalizeTime(time);

            const alreadyBooked = appointments.some(function (appointment) {
                return (
                    normalizeDate(appointment.date) === normalizedDate &&
                    normalizeTime(appointment.time) === normalizedTime
                );
            });

            const manuallyBlocked = manualBlockedSlots.some(function (slot) {
                return (
                    slot.date === normalizedDate &&
                    (slot.time === normalizedTime || slot.time === "dia-inteiro")
                );
            });

            return alreadyBooked || manuallyBlocked;
        }

        function updateAvailableTimes() {
            const selectedDate = dateInput.value;

            Array.from(timeInput.options).forEach(function (option) {
                if (!option.value) {
                    return;
                }

                option.disabled = selectedDate && isSlotUnavailable(selectedDate, option.value);
            });

            if (timeInput.value && isSlotUnavailable(selectedDate, timeInput.value)) {
                timeInput.value = "";
            }

            updateAvailabilityMessage();
        }

        function updateAvailabilityMessage() {
            if (!dateInput.value || !timeInput.value) {
                availabilityMessage.textContent = "";
                availabilityMessage.className = "availability-message";
                return;
            }

            if (isSlotUnavailable(dateInput.value, timeInput.value)) {
                availabilityMessage.textContent = "Esse horário já está indisponível. Escolha outro.";
                availabilityMessage.className = "availability-message unavailable";
            } else {
                availabilityMessage.textContent = "Horário disponível para solicitação.";
                availabilityMessage.className = "availability-message available";
            }
        }

        function generateAppointmentDates(startDate, frequency, repeatUntil) {
            const dates = [];
            const start = parseLocalDate(startDate);

            if (repeatUntil === "single" || frequency === "Atendimento avulso") {
                return [formatDateKey(start)];
            }

            let endDate;

            if (repeatUntil === "month") {
                endDate = new Date(start.getFullYear(), start.getMonth() + 1, 0);
            } else {
                endDate = addMonths(start, Number(repeatUntil));
            }

            if (frequency === "Semanal") {
                addRepeatedDates(dates, start, endDate, 7);
            }

            if (frequency === "Quinzenal") {
                addRepeatedDates(dates, start, endDate, 14);
            }

            if (frequency === "Mensal") {
                let current = new Date(start);

                while (current <= endDate) {
                    dates.push(formatDateKey(current));
                    current = addMonths(current, 1);
                }
            }

            return dates.length ? dates : [formatDateKey(start)];
        }

        function addRepeatedDates(dates, start, endDate, intervalDays) {
            let current = new Date(start);

            while (current <= endDate) {
                dates.push(formatDateKey(current));
                current.setDate(current.getDate() + intervalDays);
            }
        }

        function parseLocalDate(value) {
            return new Date(value + "T00:00:00");
        }

        function formatDateKey(date) {
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, "0");
            const day = String(date.getDate()).padStart(2, "0");

            return `${year}-${month}-${day}`;
        }

        function addMonths(date, months) {
            const result = new Date(date);
            result.setMonth(result.getMonth() + months);
            return result;
        }

        function normalizeDate(date) {
            if (!date) {
                return "";
            }

            const textDate = String(date);

            if (textDate.includes("T")) {
                return textDate.split("T")[0];
            }

            return textDate;
        }

        function normalizeTime(time) {
            if (!time) {
                return "";
            }

            return String(time).slice(0, 5);
        }

        function sendToWhatsApp(generatedAppointments) {
            const firstAppointment = generatedAppointments[0];

            const datesText = generatedAppointments
                .map(function (appointment) {
                    return `- ${formatDate(appointment.date)} às ${formatTime(appointment.time)}`;
                })
                .join("\n");

            const message = `
Olá! Nova solicitação de agendamento:

Cliente: ${firstAppointment.client}
Serviço: ${firstAppointment.service}
Frequência: ${firstAppointment.contractType}

Datas solicitadas:
${datesText}

Endereço: ${firstAppointment.address}
Observações: ${firstAppointment.notes || "Nenhuma"}

Status: aguardando confirmação.
            `;

            const url = `https://wa.me/${whatsappNumber}?text=${encodeURIComponent(message)}`;
            window.open(url, "_blank");
        }

        function formatDate(date) {
            if (!date) {
                return "";
            }

            const textDate = String(date);

            if (textDate.includes("T")) {
                const onlyDate = textDate.split("T")[0];
                return new Date(onlyDate + "T00:00:00").toLocaleDateString("pt-BR");
            }

            const parsedDate = new Date(textDate + "T00:00:00");

            if (isNaN(parsedDate.getTime())) {
                return textDate;
            }

            return parsedDate.toLocaleDateString("pt-BR");
        }

        function formatTime(time) {
            if (!time) {
                return "";
            }

            const textTime = String(time);

            if (textTime.includes("T")) {
                return new Date(textTime).toLocaleTimeString("pt-BR", {
                    hour: "2-digit",
                    minute: "2-digit"
                });
            }

            return textTime.slice(0, 5);
        }

        loadAppointments();
    </script>
</body>

</html>
